name: Collect TDnet Disclosures

on:
  schedule:
    # Daily at 02:00 JST/KST (17:00 UTC)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Collection date in YYYY-MM-DD format"
        required: false
        type: string
      mode:
        description: "Collection mode"
        required: false
        default: "recent"
        type: choice
        options:
          - recent
          - today
          - yesterday
      condition:
        description: "Yanoshin condition override"
        required: false
        type: string
      format:
        description: "Yanoshin response format"
        required: false
        default: "json2"
        type: choice
        options:
          - json2
          - json
      limit:
        description: "Yanoshin list limit"
        required: false
        default: "500"
        type: string
      process_batch_size:
        description: "process-jobs batch size per iteration"
        required: false
        default: "2"
        type: string
      download_iterations:
        description: "Number of process-jobs calls in the download loop"
        required: false
        default: "500"
        type: string
      extract_batch_size:
        description: "Number of disclosures to extract per iteration"
        required: false
        default: "50"
        type: string
      extract_iterations:
        description: "Number of extraction loop iterations"
        required: false
        default: "20"
        type: string
      parse_iterations:
        description: "Number of process-jobs calls in the parse loop"
        required: false
        default: "500"
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke collect-disclosures
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_MODE: ${{ inputs.mode || 'recent' }}
          INPUT_CONDITION: ${{ inputs.condition }}
          INPUT_FORMAT: ${{ inputs.format || 'json2' }}
          INPUT_LIMIT: ${{ inputs.limit || vars.YANOSHIN_LIST_LIMIT || '300' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          function getFunctionUrl(functionName) {
            const rawUrl =
              process.env.SUPABASE_FUNCTION_URL ||
              process.env.SUPABASE_URL ||
              process.env.NEXT_PUBLIC_SUPABASE_URL;
            if (!rawUrl) {
              throw new Error("Set SUPABASE_FUNCTION_URL, SUPABASE_URL, or NEXT_PUBLIC_SUPABASE_URL in GitHub Secrets");
            }

            const baseUrl = rawUrl.trim().replace(/\/+$/, "").replace(/\/functions\/v1$/, "");
            return `${baseUrl}/functions/v1/${functionName}`;
          }

          const payload = {
            mode: process.env.INPUT_MODE || "recent",
            format: process.env.INPUT_FORMAT || "json2",
            limit: Number(process.env.INPUT_LIMIT || "300")
          };
          if (process.env.INPUT_DATE) payload.date = process.env.INPUT_DATE;
          if (process.env.INPUT_CONDITION) payload.condition = process.env.INPUT_CONDITION;

          const response = await fetch(getFunctionUrl("collect-disclosures"), {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });
          const text = await response.text();
          console.log(text);
          if (!response.ok) process.exit(1);
          NODE

  download:
    runs-on: ubuntu-latest
    needs: collect
    if: always()
    steps:
      - name: Invoke process-jobs (download loop)
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROCESS_BATCH_SIZE: ${{ inputs.process_batch_size || vars.PROCESS_JOBS_BATCH_SIZE || '5' }}
          DOWNLOAD_ITERATIONS: ${{ inputs.download_iterations || vars.DOWNLOAD_ITERATIONS || '20' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          function getFunctionUrl(functionName) {
            const rawUrl =
              process.env.SUPABASE_FUNCTION_URL ||
              process.env.SUPABASE_URL ||
              process.env.NEXT_PUBLIC_SUPABASE_URL;
            if (!rawUrl) {
              throw new Error("Set SUPABASE_FUNCTION_URL, SUPABASE_URL, or NEXT_PUBLIC_SUPABASE_URL in GitHub Secrets");
            }

            const baseUrl = rawUrl.trim().replace(/\/+$/, "").replace(/\/functions\/v1$/, "");
            return `${baseUrl}/functions/v1/${functionName}`;
          }

          const batchSize = Number(process.env.PROCESS_BATCH_SIZE || "5");
          const iterations = Math.min(Number(process.env.DOWNLOAD_ITERATIONS || "20"), 100);
          let totalClaimed = 0;

          for (let i = 0; i < iterations; i++) {
            const response = await fetch(getFunctionUrl("process-jobs"), {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                batch_size: batchSize,
                supported_types: ["download_disclosure_pdf"]
              })
            });
            const text = await response.text();
            console.log(`[iteration ${i + 1}/${iterations}] ${text}`);
            if (!response.ok) process.exit(1);

            let result;
            try { result = JSON.parse(text); } catch { break; }
            totalClaimed += result.claimed ?? 0;
            if (result.claimed === 0) {
              console.log("No jobs claimed, stopping early.");
              break;
            }
          }

          console.log(`Total claimed: ${totalClaimed}`);
          NODE

  extract:
    runs-on: ubuntu-latest
    needs: download
    if: always()
    steps:
      - name: Install PDF text extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Extract PDF text with pdftotext (loop)
        env:
          SUPABASE_REST_URL: ${{ secrets.SUPABASE_REST_URL }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXTRACT_BATCH_SIZE: ${{ inputs.extract_batch_size || vars.EXTRACT_BATCH_SIZE || '50' }}
          EXTRACT_ITERATIONS: ${{ inputs.extract_iterations || vars.EXTRACT_ITERATIONS || '20' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const rawRestUrl =
            process.env.SUPABASE_REST_URL ||
            process.env.SUPABASE_FUNCTION_URL ||
            process.env.SUPABASE_URL ||
            process.env.NEXT_PUBLIC_SUPABASE_URL ||
            "";
          const restUrl = rawRestUrl.trim().replace(/\/+$/, "").replace(/\/functions\/v1$/, "");

          if (!restUrl) {
            console.error("Set SUPABASE_REST_URL, SUPABASE_FUNCTION_URL, SUPABASE_URL, or NEXT_PUBLIC_SUPABASE_URL in GitHub Secrets");
            process.exit(1);
          }
          if (!key) {
            console.error("SUPABASE_SERVICE_ROLE_KEY is not set");
            process.exit(1);
          }

          const headers = {
            "Authorization": `Bearer ${key}`,
            "apikey": key,
            "Content-Type": "application/json"
          };
          const batchSize = Math.min(Number(process.env.EXTRACT_BATCH_SIZE || "50"), 200);
          const iterations = Math.min(Number(process.env.EXTRACT_ITERATIONS || "20"), 100);

          const { spawnSync } = await import("child_process");
          const fs = await import("fs");
          const os = await import("os");
          const path = await import("path");

          let totalExtracted = 0;
          let totalFailed = 0;

          for (let i = 0; i < iterations; i++) {
            const listRes = await fetch(
              `${restUrl}/rest/v1/disclosures?select=id,storage_path&storage_path=not.is.null&extracted_text=is.null&document_url=not.like.*example.com*&limit=${batchSize}`,
              { headers }
            );
            if (!listRes.ok) {
              console.error("Failed to list disclosures", await listRes.text());
              process.exit(1);
            }

            const disclosures = await listRes.json();
            console.log(`[iteration ${i + 1}/${iterations}] Disclosures pending extraction: ${disclosures.length}`);
            if (disclosures.length === 0) {
              console.log("No disclosures pending extraction, stopping early.");
              break;
            }

            let iterationExtracted = 0;
            let iterationFailed = 0;

            for (const d of disclosures) {
              const tmpPdf = path.join(os.tmpdir(), `disclosure_${d.id}.pdf`);
              const tmpTxt = path.join(os.tmpdir(), `disclosure_${d.id}.txt`);
              try {
                const signRes = await fetch(
                  `${restUrl}/storage/v1/object/sign/disclosures/${d.storage_path}`,
                  { method: "POST", headers, body: JSON.stringify({ expiresIn: 120 }) }
                );
                if (!signRes.ok) throw new Error(`sign_failed:${await signRes.text()}`);

                const signed = await signRes.json();
                const signedUrl = signed.signedURL?.startsWith("http")
                  ? signed.signedURL
                  : signed.signedURL?.startsWith("/storage/v1/")
                    ? `${restUrl}${signed.signedURL}`
                    : `${restUrl}/storage/v1${signed.signedURL}`;
                if (!signedUrl) throw new Error("sign_failed:missing_signed_url");

                const dlResult = spawnSync("curl", ["-sLf", signedUrl, "-o", tmpPdf], { encoding: "utf8" });
                if (dlResult.status !== 0) throw new Error(`download_failed:${dlResult.stderr}`);

                const ptResult = spawnSync("pdftotext", ["-layout", tmpPdf, tmpTxt], { encoding: "utf8" });
                if (ptResult.status !== 0) throw new Error(`pdftotext_failed:${ptResult.stderr}`);

                const text = fs.readFileSync(tmpTxt, "utf8");
                const patchRes = await fetch(
                  `${restUrl}/rest/v1/disclosures?id=eq.${d.id}`,
                  { method: "PATCH", headers, body: JSON.stringify({ extracted_text: text }) }
                );
                if (!patchRes.ok) throw new Error(`patch_failed:${await patchRes.text()}`);

                console.log(`extracted id=${d.id} chars=${text.length}`);
                iterationExtracted++;
              } catch (err) {
                console.error(`failed id=${d.id} reason=${err instanceof Error ? err.message : String(err)}`);
                iterationFailed++;
              } finally {
                fs.rmSync(tmpPdf, { force: true });
                fs.rmSync(tmpTxt, { force: true });
              }
            }

            totalExtracted += iterationExtracted;
            totalFailed += iterationFailed;
            console.log(
              `[iteration ${i + 1}/${iterations}] Summary: extracted=${iterationExtracted} failed=${iterationFailed}`
            );
          }

          console.log(`Total extraction summary: extracted=${totalExtracted} failed=${totalFailed}`);
          NODE

  parse:
    runs-on: ubuntu-latest
    needs: extract
    if: always()
    steps:
      - name: Invoke process-jobs (parse only)
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROCESS_BATCH_SIZE: ${{ inputs.process_batch_size || vars.PROCESS_JOBS_BATCH_SIZE || '5' }}
          PARSE_ITERATIONS: ${{ inputs.parse_iterations || vars.PARSE_ITERATIONS || '20' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          function getFunctionUrl(functionName) {
            const rawUrl =
              process.env.SUPABASE_FUNCTION_URL ||
              process.env.SUPABASE_URL ||
              process.env.NEXT_PUBLIC_SUPABASE_URL;
            if (!rawUrl) {
              throw new Error("Set SUPABASE_FUNCTION_URL, SUPABASE_URL, or NEXT_PUBLIC_SUPABASE_URL in GitHub Secrets");
            }

            const baseUrl = rawUrl.trim().replace(/\/+$/, "").replace(/\/functions\/v1$/, "");
            return `${baseUrl}/functions/v1/${functionName}`;
          }

          const batchSize = Number(process.env.PROCESS_BATCH_SIZE || "5");
          const iterations = Math.min(Number(process.env.PARSE_ITERATIONS || "20"), 100);
          let totalClaimed = 0;

          for (let i = 0; i < iterations; i++) {
            const response = await fetch(getFunctionUrl("process-jobs"), {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                batch_size: batchSize,
                supported_types: ["parse_disclosure_pdf_ai"]
              })
            });
            const text = await response.text();
            console.log(`[iteration ${i + 1}/${iterations}] ${text}`);
            if (!response.ok) process.exit(1);

            let result;
            try { result = JSON.parse(text); } catch { break; }
            totalClaimed += result.claimed ?? 0;
            if (result.claimed === 0) {
              console.log("No jobs claimed, stopping early.");
              break;
            }
          }

          console.log(`Total claimed: ${totalClaimed}`);
          NODE
