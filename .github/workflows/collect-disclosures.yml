name: Collect TDnet Disclosures

on:
  schedule:
    # 16:00, 18:00, and 22:00 JST.
    - cron: "0 7,9,13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Collection date in YYYY-MM-DD format"
        required: false
        type: string
      mode:
        description: "Collection mode"
        required: false
        default: "recent"
        type: choice
        options:
          - recent
          - today
          - yesterday
      condition:
        description: "Yanoshin condition override"
        required: false
        type: string
      format:
        description: "Yanoshin response format"
        required: false
        default: "json2"
        type: choice
        options:
          - json2
          - json
      limit:
        description: "Yanoshin list limit"
        required: false
        default: "300"
        type: string
      process_batch_size:
        description: "process-jobs batch size after collection"
        required: false
        default: "5"
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke collect-disclosures
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_MODE: ${{ inputs.mode || 'recent' }}
          INPUT_CONDITION: ${{ inputs.condition }}
          INPUT_FORMAT: ${{ inputs.format || 'json2' }}
          INPUT_LIMIT: ${{ inputs.limit || vars.YANOSHIN_LIST_LIMIT || '300' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const payload = {
            mode: process.env.INPUT_MODE || "recent",
            format: process.env.INPUT_FORMAT || "json2",
            limit: Number(process.env.INPUT_LIMIT || "300")
          };
          if (process.env.INPUT_DATE) payload.date = process.env.INPUT_DATE;
          if (process.env.INPUT_CONDITION) payload.condition = process.env.INPUT_CONDITION;

          const response = await fetch(`${process.env.SUPABASE_FUNCTION_URL}/collect-disclosures`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });
          const text = await response.text();
          console.log(text);
          if (!response.ok) process.exit(1);
          NODE
  process-jobs:
    runs-on: ubuntu-latest
    needs: collect
    if: always()
    steps:
      - name: Invoke process-jobs
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROCESS_BATCH_SIZE: ${{ inputs.process_batch_size || vars.PROCESS_JOBS_BATCH_SIZE || '5' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch(`${process.env.SUPABASE_FUNCTION_URL}/process-jobs`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ batch_size: Number(process.env.PROCESS_BATCH_SIZE || "5") })
          });
          const text = await response.text();
          console.log(text);
          if (!response.ok) process.exit(1);
          NODE
