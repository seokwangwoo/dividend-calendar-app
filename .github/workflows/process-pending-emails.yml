name: Process Pending Email Notifications

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke process-pending-emails Edge Function
        run: |
          curl -sSf -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/process-pending-emails" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' || exit 1
